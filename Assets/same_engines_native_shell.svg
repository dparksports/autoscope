<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="'Segoe UI','Segoe UI Variable',system-ui,sans-serif">
  <rect width="1120" height="620" fill="#171B22"/>
  <text x="56" y="58" fill="#F1F4F9" font-size="30" font-weight="700">Same engines. Native WinUI 3 shell.</text>
  <text x="56" y="86" fill="#98A2B3" font-size="15">Lines of code, AutoCommand (WPF) &#8594; AutoScope (WinUI 3 / .NET 10). Measured 2026-10-25.</text>

  <!-- legend -->
  <g font-size="13">
    <rect x="56" y="108" width="14" height="14" rx="3" fill="#3B82F6"/><text x="78" y="120" fill="#98A2B3">copied as-is</text>
    <rect x="180" y="108" width="14" height="14" rx="3" fill="#34D399"/><text x="202" y="120" fill="#98A2B3">rewritten WPF &#8594; WinUI</text>
    <rect x="360" y="108" width="14" height="14" rx="3" fill="#FBBF24"/><text x="382" y="120" fill="#98A2B3">leaner port</text>
    <rect x="480" y="108" width="14" height="14" rx="3" fill="#4A9EEF"/><text x="502" y="120" fill="#98A2B3">new code</text>
    <rect x="590" y="108" width="14" height="14" rx="3" fill="#39414F"/><text x="612" y="120" fill="#98A2B3">not ported (other 8 tabs)</text>
  </g>

  <!-- scale: 40,391 -> 1008px max bar -->
  <!-- engine: 25,794 copied => bar 644px -->
  <text x="56" y="168" fill="#F1F4F9" font-size="16" font-weight="600">Engine layer — firewall COM, sniffer, Sysmon, probes, verdicts, attribution</text>
  <rect x="56" y="180" width="644" height="26" rx="6" fill="#3B82F6"/>
  <text x="712" y="199" fill="#98A2B3" font-size="14">25,794 lines, ported verbatim into AutoScope.Core</text>

  <!-- six tabs: 4,366 -> 109px ; 4,537 -> 113px -->
  <text x="56" y="252" fill="#F1F4F9" font-size="16" font-weight="600">The six tab UIs — rewritten for WinUI, logic unchanged</text>
  <rect x="56" y="264" width="109" height="26" rx="6" fill="#34D399" opacity="0.55"/>
  <rect x="56" y="264" width="113" height="26" rx="6" fill="#34D399"/>
  <text x="181" y="283" fill="#98A2B3" font-size="14">4,366 &#8594; 4,537 (+4%)</text>

  <!-- shell+theme: 1,308 -> 33px ; 710 -> 18px (min visible 8) -->
  <text x="56" y="334" fill="#F1F4F9" font-size="16" font-weight="600">Shell, theme, converters</text>
  <rect x="56" y="346" width="33" height="26" rx="6" fill="#FBBF24" opacity="0.55"/>
  <rect x="56" y="346" width="18" height="26" rx="6" fill="#FBBF24"/>
  <text x="101" y="365" fill="#98A2B3" font-size="14">1,308 &#8594; 710 — the 1,050-line WPF style dictionary became 150 lines</text>

  <!-- new glue: 425 -> 11px min 10 -->
  <text x="56" y="416" fill="#F1F4F9" font-size="16" font-weight="600">New in AutoScope — AutoCommand adoption, AI consent UI, dialogs</text>
  <rect x="56" y="428" width="10" height="26" rx="5" fill="#4A9EEF"/>
  <text x="78" y="447" fill="#98A2B3" font-size="14">425 lines written from scratch</text>

  <!-- not ported: 8,462 -> 211px -->
  <text x="56" y="498" fill="#F1F4F9" font-size="16" font-weight="600">AutoCommand's other eight tabs (Transmissions, Spawns, BITS, Defender…)</text>
  <rect x="56" y="510" width="211" height="26" rx="6" fill="#39414F"/>
  <text x="279" y="529" fill="#98A2B3" font-size="14">8,462 lines, out of scope by design</text>

  <!-- totals -->
  <rect x="56" y="556" width="1008" height="40" rx="10" fill="#1F242E" stroke="#39414F"/>
  <text x="76" y="582" fill="#F1F4F9" font-size="15" font-weight="600">Totals:  AutoCommand app 40,391 lines (14 tabs)   &#8594;   AutoScope 32,674 lines (6 tabs)</text>
</svg>
